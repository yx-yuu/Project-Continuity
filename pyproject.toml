[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-harness"
version = "0.6.0"
description = "A lightweight, agent-maintained protocol for research projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YYX"}]
keywords = ["research", "coding-agent", "project-management", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/yx-yuu/research-harness"
Repository = "https://github.com/yx-yuu/research-harness"

[project.scripts]
research-harness = "research_harness.research_harness:main"

[tool.setuptools]
packages = ["research_harness", "research_harness.templates"]

[tool.setuptools.package-dir]
research_harness = "plugins/codex-research-harness/scripts"
"research_harness.templates" = "plugins/codex-research-harness/assets/project-template"

[tool.setuptools.package-data]
"research_harness.templates" = ["*.md"]
