[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "project-continuity"
version = "0.9.0"
description = "A lightweight, agent-maintained protocol for project continuity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "YYX"}]
keywords = ["coding-agent", "context", "project-management", "continuity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/yx-yuu/research-harness"
Repository = "https://github.com/yx-yuu/research-harness"

[project.scripts]
project-continuity = "project_continuity.project_continuity:main"

[tool.setuptools]
packages = ["project_continuity", "project_continuity.templates"]

[tool.setuptools.package-dir]
project_continuity = "plugins/project-continuity/scripts"
"project_continuity.templates" = "plugins/project-continuity/assets/project-template"

[tool.setuptools.package-data]
"project_continuity.templates" = ["*.md"]
