name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install source package
        run: python -m pip install .
      - name: Check installed command
        run: project-continuity --version
      - name: Build and check zipapp
        run: |
          python scripts/build_zipapp.py
          python dist/project-continuity.pyz --version

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Build distributions
        run: uv build
      - name: Check wheel contents
        run: python scripts/verify_wheel.py
      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/project-continuity-wheel"
          "$RUNNER_TEMP/project-continuity-wheel/bin/python" -m pip install --no-deps dist/project_continuity-*.whl
          target="$(mktemp -d)"
          "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity" init "$target" --json
          "$RUNNER_TEMP/project-continuity-wheel/bin/project-continuity" init "$target" --json > "$RUNNER_TEMP/project-continuity-refresh.json"
          python -c 'import json,sys; sys.exit(bool(json.load(open(sys.argv[1], encoding="utf-8"))["planned"]))' "$RUNNER_TEMP/project-continuity-refresh.json"
          test -f "$target/agent-docs/project.md"
          test -f "$target/agent-docs/state.md"
